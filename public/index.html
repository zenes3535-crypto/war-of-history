<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>War of History</title>
<style>
  :root { --bg:#0e1620; --panel:rgba(16,22,30,.94); --panel2:#1b2632; --line:#33414f; --txt:#eef2f6; --mut:#9aa7b4; --acc:#e8b84a; --red:#d9534f; --green:#4caf50; --blue:#4a90d9; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; user-select:none; }
  canvas#cv { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hidden { display:none !important; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 24px #0008; }
  h1 { margin:0; font:800 34px/1.1 Georgia,'Times New Roman',serif; letter-spacing:3px; color:var(--acc); text-shadow:0 2px 0 #000; }
  h3 { margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--mut); font-weight:700; }
  input, select { width:100%; padding:9px 11px; border-radius:7px; border:1px solid var(--line); background:#0b121a; color:var(--txt); font-size:14px; }
  button { padding:8px 12px; border-radius:7px; border:0; background:var(--acc); color:#1d1500; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap; }
  button.sec { background:#2b3a4a; color:var(--txt); }
  button.red { background:#a8322e; color:#fff; }
  button.green { background:#2f7d43; color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  button:not(:disabled):hover { filter:brightness(1.12); }
  .row { display:flex; gap:6px; align-items:center; }
  .row > .grow { flex:1; }
  .mut { color:var(--mut); }
  .flag { width:22px; height:15px; border-radius:2px; object-fit:cover; vertical-align:middle; box-shadow:0 0 0 1px #0006; background:#555; display:inline-block; }
  .flag.big { width:42px; height:28px; }
  /* menü */
  #menu { left:50%; top:50%; transform:translate(-50%,-50%); width:min(380px,92vw); padding:22px; text-align:center; }
  #menu p { color:var(--mut); margin:8px 0 16px; }
  #menu button { width:100%; margin-top:8px; padding:11px; font-size:14px; }
  #err { color:#ff8a80; min-height:18px; margin-top:8px; }
  /* lobi */
  #lobby { left:12px; top:12px; width:min(320px,94vw); padding:14px; max-height:calc(100% - 24px); overflow:auto; }
  .code { font:800 26px monospace; letter-spacing:6px; color:var(--acc); }
  .pl { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #ffffff10; }
  .pl small { margin-left:auto; color:var(--mut); }
  /* üst bar */
  #top { left:0; right:0; top:0; border-radius:0; border-width:0 0 1px; padding:6px 10px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; z-index:5; }
  #top .stat { display:flex; align-items:center; gap:5px; font-weight:700; }
  #top .stat small { font-weight:500; color:var(--mut); }
  #me { display:flex; align-items:center; gap:8px; font:800 15px Georgia,serif; letter-spacing:1px; cursor:pointer; }
  #clock { margin-left:auto; display:flex; align-items:center; gap:6px; }
  #date { font:700 15px Georgia,serif; min-width:150px; text-align:right; }
  .spd { padding:4px 8px; background:#2b3a4a; color:var(--txt); font-size:12px; }
  .spd.on { background:var(--acc); color:#1d1500; }
  /* sol araç çubuğu */
  #tools { left:8px; top:56px; display:flex; flex-direction:column; gap:6px; padding:6px; z-index:4; }
  #tools button { width:42px; height:42px; padding:0; font-size:20px; background:#223040; }
  #tools button.on { background:var(--acc); }
  /* paneller */
  .side { left:60px; top:56px; width:min(380px,calc(100vw - 70px)); max-height:calc(100% - 70px); overflow:auto; padding:12px; z-index:4; }
  #provPanel { left:60px; bottom:10px; width:min(360px,calc(100vw - 70px)); padding:12px; z-index:3; max-height:60vh; overflow:auto; }
  #civPanel { right:10px; top:56px; width:min(340px,92vw); padding:12px; z-index:4; max-height:calc(100% - 70px); overflow:auto; }
  .close { float:right; background:transparent; color:var(--mut); font-size:18px; padding:0 4px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:6px 0; }
  .kv b { text-align:right; }
  .bld { display:flex; align-items:center; gap:6px; padding:5px 0; border-top:1px solid #ffffff10; }
  .bld .grow { flex:1; }
  .lvl { color:var(--acc); font-weight:700; }
  .bar { height:7px; border-radius:4px; background:#0006; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--acc); }
  .relbar { height:8px; border-radius:4px; background:linear-gradient(90deg,#c0392b,#7f8c8d 50%,#27ae60); position:relative; }
  .relbar i { position:absolute; top:-3px; width:4px; height:14px; background:#fff; border-radius:2px; }
  .tech { padding:8px; border-radius:7px; background:var(--panel2); margin-bottom:6px; border:1px solid transparent; cursor:pointer; }
  .tech.done { opacity:.55; cursor:default; }
  .tech.lock { opacity:.4; cursor:default; }
  .tech.cur { border-color:var(--acc); }
  .civrow { display:flex; align-items:center; gap:8px; padding:5px 4px; border-radius:6px; cursor:pointer; }
  .civrow:hover { background:#ffffff0d; }
  .tag { font-size:11px; padding:1px 6px; border-radius:6px; background:#2b3a4a; }
  .tag.war { background:#7a2723; } .tag.ally { background:#1f5b8f; } .tag.pact { background:#2f6b3c; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
  .stars { color:#f5c542; letter-spacing:1px; } .stars .off { color:#4a5866; }
  /* sohbet */
  #chatBox { height:260px; overflow:auto; background:#0007; border-radius:7px; padding:8px; margin:8px 0; user-select:text; }
  .msg { margin:4px 0; } .msg.me { text-align:right; } .msg span { display:inline-block; padding:5px 9px; border-radius:9px; background:#2b3a4a; max-width:85%; text-align:left; }
  .msg.me span { background:#6b5418; }
  /* modal */
  #modal { left:50%; top:50%; transform:translate(-50%,-50%); width:min(460px,94vw); max-height:86vh; overflow:auto; padding:16px; z-index:10; }
  #modal.right { left:auto; right:10px; top:56px; transform:none; }
  #modal .plist { max-height:220px; overflow:auto; background:#0006; border-radius:7px; padding:6px; margin:6px 0; }
  #modal label { display:flex; align-items:center; gap:8px; padding:3px 2px; cursor:pointer; }
  #modal input[type=checkbox] { width:auto; }
  /* olay akışı */
  #toasts { position:fixed; right:10px; bottom:10px; display:flex; flex-direction:column; gap:5px; align-items:flex-end; pointer-events:none; z-index:6; max-width:min(440px,90vw); }
  .toast { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12.5px; box-shadow:0 3px 12px #0007; }
  .toast.err { border-color:#a8322e; }
  #sel { left:50%; bottom:10px; transform:translateX(-50%); padding:7px 12px; z-index:3; display:flex; gap:8px; align-items:center; }
  #tip { position:fixed; pointer-events:none; background:#000c; padding:5px 8px; border-radius:6px; font-size:12px; z-index:9; white-space:nowrap; }
  #defeat { left:50%; top:40%; transform:translate(-50%,-50%); padding:24px 34px; text-align:center; z-index:11; font:800 26px Georgia,serif; }
  .evrow { padding:4px 0; border-bottom:1px solid #ffffff10; } .evrow small { color:var(--mut); }
  @media (max-width:700px) { #top { gap:8px; font-size:12px; } #date { min-width:0; } .side, #provPanel { left:8px; width:calc(100vw - 16px); } #tools { top:auto; bottom:8px; flex-direction:row; left:8px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="menu" class="panel">
  <h1>WAR OF HISTORY</h1>
  <p>Bir ülke seç, ekonomini büyüt, ittifaklar kur, dünyayı fethet.</p>
  <input id="name" maxlength="16" placeholder="Liderin adı">
  <button id="solo">🎖 Tek Oyunculu (Yapay Zekâya Karşı)</button>
  <button id="create" class="sec">👥 Çok Oyunculu Oda Kur</button>
  <div class="row" style="margin-top:8px"><input id="code" maxlength="4" placeholder="Oda kodu" style="text-transform:uppercase"><button id="join" class="sec" style="width:auto;margin:0">Katıl</button></div>
  <div id="err"></div>
  <div class="mut" id="loading" style="margin-top:6px;font-size:12px">Harita yükleniyor…</div>
</div>

<div id="lobby" class="panel hidden">
  <div id="roomBox"><h3>Oda kodu</h3><div class="row"><div class="code grow" id="roomCode">----</div><button class="sec" id="copy">Linki kopyala</button></div></div>
  <h3 style="margin-top:12px">Senaryo</h3>
  <select id="scenario"></select>
  <h3 style="margin-top:12px">Oyun hızı</h3>
  <select id="speedSel"></select>
  <h3 style="margin-top:12px">Oyuncular</h3>
  <div id="plist"></div>
  <div id="pickInfo" style="margin:10px 0;padding:10px;border-radius:8px;background:#0006">Haritada bir ülkeye tıklayarak ülkeni seç.</div>
  <button id="start" style="width:100%">Oyunu Başlat</button>
  <div id="wait" class="hidden mut" style="text-align:center;margin-top:6px">Kurucunun başlatması bekleniyor…</div>
</div>

<div id="top" class="panel hidden">
  <div id="me"></div>
  <div class="stat" title="Hazine (günlük net gelir)">💰 <span id="sGold">0</span> <small id="sNet"></small></div>
  <div class="stat" title="Toplam asker (sahadaki ordular)">⚔ <span id="sTroops">0</span></div>
  <div class="stat" title="İnsan gücü (asker toplanabilecek nüfus)">👥 <span id="sMan">0</span></div>
  <div class="stat" title="Nüfus">🏙 <span id="sPop">0</span></div>
  <div class="stat" title="Araştırma">🔬 <span id="sRes">—</span></div>
  <div class="stat" title="Hava filosu">✈ <span id="sAir">0</span></div>
  <div id="clock"><span id="date">—</span><span id="spdBtns"></span></div>
</div>

<div id="tools" class="panel hidden">
  <button data-p="overview" title="Ülkem">🏛</button>
  <button data-p="tech" title="Teknoloji">🔬</button>
  <button data-p="diplo" title="Diplomasi">🤝</button>
  <button data-p="chat" title="Mesajlar">💬</button>
  <button data-p="log" title="Olaylar">📜</button>
  <button id="mapMode" title="Harita modu: Siyasi / Diplomatik">🗺</button>
</div>

<div id="side" class="panel side hidden"></div>
<div id="provPanel" class="panel hidden"></div>
<div id="civPanel" class="panel hidden"></div>
<div id="modal" class="panel hidden"></div>
<div id="sel" class="panel hidden"></div>
<div id="defeat" class="panel hidden"></div>
<div id="tip" class="hidden"></div>
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
